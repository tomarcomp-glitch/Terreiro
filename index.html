<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terreiro Pai Jacó</title>
<style>
:root{color-scheme:light dark;--fundo:#f6f2ea;--papel:#fffdf8;--texto:#221f18;--suave:#675f50;--linha:#e0d8c6;--verde:#1f4d3a;--sobre:#ffffff;--ouro:#8f6f22;--perigo:#a1352a;--ok:#25683f;--foco:#1f6feb}
@media (prefers-color-scheme:dark){:root{--fundo:#14130e;--papel:#1d1b14;--texto:#ece6d6;--suave:#a8a190;--linha:#363322;--verde:#6dbb94;--sobre:#0d1a13;--ouro:#d6b560;--perigo:#e8806f;--ok:#7cc79a;--foco:#79b0ff}}
*{box-sizing:border-box}
body{margin:0;background:var(--fundo);color:var(--texto);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;line-height:1.2;margin:0 0 .5rem}
h1{font-size:1.9rem}h2{font-size:1.3rem}
a{color:var(--verde)}
:focus-visible{outline:3px solid var(--foco);outline-offset:2px}
.topo{position:sticky;top:0;z-index:5;background:var(--papel);border-bottom:1px solid var(--linha);display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.6rem 1rem;flex-wrap:wrap}
.marca{font:700 1.2rem Georgia,serif;color:var(--texto);text-decoration:none}
nav{display:flex;gap:.25rem;align-items:center}
nav a,nav .link{padding:.5rem .75rem;border-radius:6px;color:var(--texto);text-decoration:none;min-height:40px;display:inline-flex;align-items:center}
nav a[aria-current]{background:var(--verde);color:var(--sobre)}
.link{background:none;border:0;font:inherit;cursor:pointer;color:var(--verde);padding:0;text-decoration:underline}
nav .link{text-decoration:none;color:var(--texto)}
.menu-btn{display:none}
@media(max-width:720px){.menu-btn{display:inline-block}nav{display:none;width:100%;flex-direction:column;align-items:stretch}nav.aberto{display:flex}}
main{max-width:980px;margin:0 auto;padding:1.25rem 1rem 3rem;outline:none}
.btn{background:var(--verde);color:var(--sobre);border:1px solid var(--verde);border-radius:6px;padding:.6rem 1rem;font:inherit;font-weight:600;cursor:pointer;min-height:40px}
.btn.sec{background:transparent;color:var(--texto);border-color:var(--linha)}
.btn.perigo{background:transparent;color:var(--perigo);border-color:var(--perigo)}
.btn.peq{padding:.3rem .6rem;min-height:34px;font-weight:500}
.btn:disabled{opacity:.6;cursor:wait}
.hero{padding:1.5rem 0 1rem;border-bottom:2px solid var(--ouro);margin-bottom:1.5rem}
.hero p{margin:0;color:var(--suave)}
.duas{display:grid;grid-template-columns:2fr 1fr;gap:2rem}
@media(max-width:760px){.duas{grid-template-columns:1fr}}
.noticia{padding:1rem 0;border-bottom:1px solid var(--linha)}
.noticia:first-of-type{padding-top:0}
.noticia time,.suave{color:var(--suave);font-size:.9rem}
.evento{display:flex;gap:.8rem;padding:.7rem 0;border-bottom:1px solid var(--linha)}
.evento .dia{min-width:3.2rem;text-align:center;font-family:Georgia,serif;line-height:1.1}
.evento .dia b{display:block;font-size:1.5rem;color:var(--ouro)}
.vazio{color:var(--suave);padding:1rem 0}
.aviso-pend{background:var(--papel);border:1px solid var(--ouro);border-left-width:5px;padding:.8rem 1rem;margin-bottom:1.25rem;border-radius:6px}
.cartao{background:var(--papel);border:1px solid var(--linha);border-radius:8px;padding:1.25rem}
.estreito{max-width:420px;margin:1rem auto}
label{display:block;font-weight:600;margin:.8rem 0 .25rem}
input,select,textarea{width:100%;font:inherit;color:var(--texto);background:var(--fundo);border:1px solid var(--linha);border-radius:6px;padding:.55rem .65rem;min-height:40px}
textarea{min-height:130px;resize:vertical}
label.chk{display:flex;gap:.5rem;align-items:center;font-weight:500}
label.chk input{width:auto;min-height:0}
.erro{color:var(--perigo);margin:.6rem 0 0;min-height:1.2em}
.certo{color:var(--ok)}
.abas{display:flex;gap:.25rem;flex-wrap:wrap;border-bottom:1px solid var(--linha);margin-bottom:1rem}
.abas a{padding:.5rem .8rem;text-decoration:none;color:var(--texto);border-bottom:3px solid transparent}
.abas a[aria-current]{border-color:var(--ouro);font-weight:700}
.cab{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:.8rem}
.filtros{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:.8rem}
.filtros input{flex:1;min-width:160px;width:auto}
.rolagem{overflow-x:auto;border:1px solid var(--linha);border-radius:8px;background:var(--papel)}
table{border-collapse:collapse;width:100%;min-width:520px}
th,td{padding:.6rem .75rem;text-align:left;border-bottom:1px solid var(--linha);vertical-align:top}
th{font-size:.85rem;color:var(--suave);font-weight:600;white-space:nowrap}
tr:last-child td{border-bottom:0}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.acoes{white-space:nowrap;text-align:right}
td.ok,td.rec{color:var(--ok);font-weight:600}
td.neg,td.des,tr.alerta td.sit{color:var(--perigo);font-weight:600}
td.rasc{color:var(--suave)}
tr.alerta{background:color-mix(in srgb,var(--perigo) 8%,transparent)}
.totais{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;margin-bottom:.8rem}
.totais div{background:var(--papel);border:1px solid var(--linha);border-radius:8px;padding:.6rem .8rem}
.totais span{display:block;font-size:.85rem;color:var(--suave)}
.totais strong{font-size:1.15rem;font-variant-numeric:tabular-nums}
strong.ok{color:var(--ok)}strong.neg{color:var(--perigo)}
dialog{border:1px solid var(--linha);border-radius:10px;background:var(--papel);color:var(--texto);width:min(520px,calc(100% - 1.5rem));padding:1.25rem;max-height:92vh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.5)}
.rodape{display:flex;gap:.6rem;justify-content:flex-end;margin-top:1rem}
#aviso{position:fixed;left:50%;bottom:1rem;transform:translateX(-50%);background:var(--texto);color:var(--fundo);padding:.6rem 1rem;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:90%}
#aviso.v{opacity:1}#aviso.e{background:var(--perigo);color:#fff}
@media(prefers-reduced-motion:reduce){#aviso{transition:none}}
.img-n{display:block;max-width:100%;max-height:360px;border-radius:8px;margin:.5rem 0}
.img-e{display:block;width:100%;max-height:200px;object-fit:cover;border-radius:6px;margin:.4rem 0}
.prev{display:block;max-width:100%;max-height:160px;border-radius:6px;margin:.4rem 0}
@media print{.topo,.btn,.filtros,.abas,.acoes{display:none!important}}
</style>
</head>
<body>
<header class="topo">
  <a class="marca" href="#/" id="marca"></a>
  <button class="btn sec menu-btn" id="menuBtn" aria-expanded="false" aria-controls="nav">Menu</button>
  <nav id="nav" aria-label="Principal"></nav>
</header>
<main id="app" tabindex="-1"><p class="vazio">Carregando…</p></main>
<dialog id="dlg" aria-labelledby="dlgT"></dialog>
<dialog id="dlg2" aria-labelledby="dlg2T"></dialog>
<div id="aviso" role="status" aria-live="polite"></div>
<noscript><p style="padding:1rem">Este site precisa de JavaScript ativado.</p></noscript>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const CONFIG = {
  nome: 'Terreiro Pai Jacó',
  url: 'https://lfyyjbrnbhhrdlyfrxmh.supabase.co',
  chave: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxmeXlqYnJuYmhocmRseWZyeG1oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0NTA0MDMsImV4cCI6MjEwODAyNjQwM30._dXqWTzkSDmVroTBTLtNpk09YRdj_wHozjfosmI2h2c'
};

const sb = supabase.createClient(CONFIG.url, CONFIG.chave);
const $ = s => document.querySelector(s);
const app = $('#app');
const nav = $('#nav');

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const texto = s => esc(s).replace(/\n/g, '<br>');
const norm = s => String(s ?? '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
const brl = n => new Intl.NumberFormat('pt-BR', {style:'currency', currency:'BRL'}).format(Number(n) || 0);
const dataBR = iso => iso ? new Date(/^\d{4}-\d{2}-\d{2}$/.test(iso) ? iso + 'T00:00:00' : iso).toLocaleDateString('pt-BR') : '';
const dataHoraBR = iso => iso ? new Date(iso).toLocaleString('pt-BR', {dateStyle:'short', timeStyle:'short'}) : '';
const hoje = () => new Date().toLocaleDateString('sv-SE');
const paraLocal = iso => {
  if (!iso) return '';
  const d = new Date(iso), p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
};

const imgUrl = p => sb.storage.from('imagens').getPublicUrl(p).data.publicUrl;
const imgTag = (p, cls) => p ? `<img class="${cls}" loading="lazy" src="${esc(imgUrl(p))}" alt="">` : '';

function comprimir(file, max = 1280, q = 0.8) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const f = Math.min(1, max / Math.max(img.width, img.height));
      const w = Math.round(img.width * f), h = Math.round(img.height * f);
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); x.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      c.toBlob(b => b ? res(b) : rej(new Error('Não foi possível processar a imagem.')), 'image/jpeg', q);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Arquivo de imagem inválido.')); };
    img.src = url;
  });
}

async function enviarImagem(file, pasta) {
  const blob = await comprimir(file);
  const id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(36).slice(2);
  const path = `${pasta}/${id}.jpg`;
  const {error} = await sb.storage.from('imagens').upload(path, blob, {contentType:'image/jpeg', cacheControl:'3600'});
  if (error) throw error;
  return path;
}

async function apagarImagens(caminhos) {
  const lista = caminhos.filter(Boolean);
  if (!lista.length) return true;
  const {error} = await sb.storage.from('imagens').remove(lista);
  return !error;
}

let limpou = false;
async function limparEventosEncerrados() {
  if (limpou) return;
  limpou = true;
  const {data, error} = await sb.from('eventos').select('id,imagem_path').lt('data_hora', new Date().toISOString()).not('imagem_path', 'is', null);
  if (error || !data || !data.length) return;
  if (!(await apagarImagens(data.map(e => e.imagem_path)))) { limpou = false; return; }
  const r = await sb.from('eventos').update({imagem_path: null}).in('id', data.map(e => e.id));
  if (!r.error) aviso(data.length + (data.length === 1 ? ' imagem de evento encerrado foi apagada.' : ' imagens de eventos encerrados foram apagadas.'));
}

let sessao = null, perfil = null, timerAviso = null;

function aviso(msg, erro) {
  const a = $('#aviso');
  a.textContent = msg;
  a.className = 'v' + (erro ? ' e' : '');
  clearTimeout(timerAviso);
  timerAviso = setTimeout(() => { a.className = ''; }, 3500);
}

function msgErro(e) {
  const m = (e && e.message) || String(e || '');
  if (/Invalid login credentials/i.test(m)) return 'E-mail ou senha incorretos.';
  if (/Email not confirmed/i.test(m)) return 'Confirme seu e-mail antes de entrar (veja a caixa de entrada e o spam).';
  if (/already registered/i.test(m)) return 'Este e-mail já tem cadastro. Use "Entrar".';
  if (/Password should be at least/i.test(m)) return 'A senha precisa ter pelo menos 6 caracteres.';
  if (/rate limit/i.test(m)) return 'Muitas tentativas. Aguarde alguns minutos e tente de novo.';
  if (e && e.code === '23503') return 'Este registro está em uso em outra tela e não pode ser excluído.';
  if (/row-level security|permission denied/i.test(m)) return 'Você não tem permissão para esta ação.';
  if (/exceeded the maximum allowed size|too large/i.test(m)) return 'A imagem é grande demais.';
  if (/Failed to fetch|NetworkError/i.test(m)) return 'Sem conexão com o servidor. Verifique a internet.';
  return m;
}

async function carregarPerfil() {
  perfil = null;
  if (!sessao) return;
  const {data} = await sb.from('profiles').select('*').eq('id', sessao.user.id).maybeSingle();
  perfil = data;
}

function desenharNav() {
  const adm = perfil && perfil.papel === 'admin';
  nav.innerHTML = '<a href="#/">Início</a><a href="#/agenda">Agenda</a>'
    + (adm ? '<a href="#/admin/noticias">Painel</a>' : '')
    + (sessao ? '<button class="link" id="sair" type="button">Sair</button>' : '<a href="#/entrar">Entrar</a>');
  const s = $('#sair');
  if (s) s.onclick = async () => { await sb.auth.signOut(); location.hash = '#/'; };
}

function confirmar(msg, rotulo) {
  return new Promise(res => {
    const d = $('#dlg2');
    d.innerHTML = `<form><h2 id="dlg2T">Confirmar</h2><p>${esc(msg)}</p><div class="rodape"><button type="button" class="btn sec" id="nao">Cancelar</button><button class="btn perigo" id="sim">${esc(rotulo)}</button></div></form>`;
    d.showModal();
    d.querySelector('form').onsubmit = e => { e.preventDefault(); d.close(); res(true); };
    d.querySelector('#nao').onclick = () => { d.close(); res(false); };
    d.onclose = () => res(false);
  });
}

/* ---------- Telas públicas ---------- */

async function viewInicio() {
  app.innerHTML = `<section class="hero"><h1>${esc(CONFIG.nome)}</h1><p>Notícias, avisos e agenda do terreiro.</p></section><p class="vazio">Carregando…</p>`;
  const [n, e] = await Promise.all([
    sb.from('noticias').select('*').eq('publicada', true).order('criado_em', {ascending:false}).limit(20),
    sb.from('eventos').select('*').gte('data_hora', new Date().toISOString()).order('data_hora').limit(5)
  ]);
  const pend = perfil && perfil.papel === 'pendente'
    ? '<div class="aviso-pend">Seu cadastro foi recebido e aguarda a aprovação do administrador para liberar a área de membros.</div>' : '';
  const noticias = n.error ? `<p class="erro">${esc(msgErro(n.error))}</p>`
    : !n.data.length ? '<p class="vazio">Nenhuma notícia publicada ainda.</p>'
    : n.data.map(x => `<article class="noticia"><h3>${esc(x.titulo)}</h3><time>${dataBR(x.criado_em)}</time>${imgTag(x.imagem_path, 'img-n')}<p>${texto(x.texto)}</p></article>`).join('');
  const eventos = e.error ? `<p class="erro">${esc(msgErro(e.error))}</p>`
    : !e.data.length ? '<p class="vazio">Nenhum evento agendado.</p>'
    : e.data.map(blocoEvento).join('');
  app.innerHTML = `<section class="hero"><h1>${esc(CONFIG.nome)}</h1><p>Notícias, avisos e agenda do terreiro.</p></section>${pend}
    <div class="duas"><section><h2>Notícias</h2>${noticias}</section><aside><h2>Próximos eventos</h2>${eventos}<p><a href="#/agenda">Ver agenda completa</a></p></aside></div>`;
}

function blocoEvento(x) {
  const d = new Date(x.data_hora);
  const mes = d.toLocaleDateString('pt-BR', {month:'short'}).replace('.', '');
  return `<div class="evento"><div class="dia"><b>${d.getDate()}</b>${esc(mes)}</div><div><strong>${esc(x.titulo)}</strong>${x.publico ? '' : ' <span class="suave">(só membros)</span>'}<br><span class="suave">${d.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'})}${x.local ? ' · ' + esc(x.local) : ''}</span>${imgTag(x.imagem_path, 'img-e')}${x.descricao ? '<br>' + texto(x.descricao) : ''}</div></div>`;
}

async function viewAgenda() {
  app.innerHTML = '<h1>Agenda</h1><p class="vazio">Carregando…</p>';
  const {data, error} = await sb.from('eventos').select('*').gte('data_hora', new Date().toISOString()).order('data_hora');
  const corpo = error ? `<p class="erro">${esc(msgErro(error))}</p>`
    : !data.length ? '<p class="vazio">Nenhum evento agendado por enquanto.</p>'
    : data.map(blocoEvento).join('');
  const dica = sessao ? '' : '<p class="suave">Entre com sua conta de membro para ver também os eventos internos.</p>';
  app.innerHTML = `<h1>Agenda</h1>${dica}${corpo}`;
}

function viewEntrar() {
  app.innerHTML = `<div class="cartao estreito"><h1 id="tit">Entrar</h1>
    <form id="frmL" novalidate>
      <div id="campoNome" hidden><label for="nome">Seu nome</label><input id="nome" autocomplete="name"></div>
      <label for="email">E-mail</label><input id="email" type="email" autocomplete="email" inputmode="email">
      <label for="senha">Senha</label><input id="senha" type="password" autocomplete="current-password">
      <p class="erro" id="erroL" role="alert"></p>
      <button class="btn" id="env" style="width:100%;margin-top:.6rem">Entrar</button>
    </form>
    <p class="suave"><span id="txtAlt">Ainda não tem cadastro?</span> <button class="link" id="alt" type="button">Criar conta</button></p></div>`;
  let cadastro = false;
  const msg = (t, ok) => { const p = $('#erroL'); p.textContent = t; p.className = 'erro' + (ok ? ' certo' : ''); };
  $('#alt').onclick = () => {
    cadastro = !cadastro; msg('');
    $('#tit').textContent = cadastro ? 'Criar conta' : 'Entrar';
    $('#env').textContent = cadastro ? 'Criar conta' : 'Entrar';
    $('#txtAlt').textContent = cadastro ? 'Já tem cadastro?' : 'Ainda não tem cadastro?';
    $('#alt').textContent = cadastro ? 'Entrar' : 'Criar conta';
    $('#campoNome').hidden = !cadastro;
    $('#senha').autocomplete = cadastro ? 'new-password' : 'current-password';
  };
  $('#frmL').onsubmit = async ev => {
    ev.preventDefault();
    const email = $('#email').value.trim(), senha = $('#senha').value, nome = $('#nome').value.trim();
    if (cadastro && !nome) { msg('Informe seu nome.'); $('#nome').focus(); return; }
    if (!email) { msg('Informe seu e-mail.'); $('#email').focus(); return; }
    if (senha.length < 6) { msg('A senha precisa ter pelo menos 6 caracteres.'); $('#senha').focus(); return; }
    const btn = $('#env'); btn.disabled = true; msg('');
    if (cadastro) {
      const {data, error} = await sb.auth.signUp({email, password: senha, options: {data: {nome}}});
      btn.disabled = false;
      if (error) { msg(msgErro(error)); return; }
      if (data.session) { location.hash = '#/'; return; }
      msg('Cadastro criado. Enviamos um link de confirmação para o seu e-mail. Confirme e depois entre.', true);
    } else {
      const {error} = await sb.auth.signInWithPassword({email, password: senha});
      btn.disabled = false;
      if (error) { msg(msgErro(error)); return; }
      location.hash = '#/';
    }
  };
  $('#email').focus();
}

/* ---------- Painel administrativo ---------- */

const ABAS = [['#/admin/noticias','Notícias'],['#/admin/eventos','Eventos'],['#/admin/membros','Membros'],['#/admin/financeiro','Financeiro'],['#/admin/estoque','Estoque'],['#/admin/usuarios','Usuários']];
const abas = atual => '<div class="abas">' + ABAS.map(([h, t]) => `<a href="${h}"${h === atual ? ' aria-current="page"' : ''}>${t}</a>`).join('') + '</div>';

function exigirAdmin() {
  if (!sessao) { app.innerHTML = '<div class="cartao estreito"><h1>Painel</h1><p>Entre com a conta de administrador para acessar.</p><a class="btn" href="#/entrar">Entrar</a></div>'; return false; }
  if (!perfil || perfil.papel !== 'admin') { app.innerHTML = '<div class="cartao estreito"><h1>Acesso restrito</h1><p>O painel é exclusivo do administrador.</p></div>'; return false; }
  return true;
}

const CFG = {
  noticias: {
    aba:'#/admin/noticias', tabela:'noticias', titulo:'Notícias', singular:'notícia', botao:'Nova notícia',
    vazio:'Nenhuma notícia ainda. Escreva a primeira e marque "Publicar no portal" para ela aparecer no site.',
    ordem:['criado_em', false], busca:['titulo','texto'], nome:r => r.titulo,
    colunas:[
      {r:'Título', fmt:r => r.titulo},
      {r:'Criada em', fmt:r => dataHoraBR(r.criado_em)},
      {r:'Situação', fmt:r => r.publicada ? 'Publicada' : 'Rascunho', cls:r => r.publicada ? 'ok' : 'rasc'},
      {r:'Imagem', fmt:r => r.imagem_path ? 'Sim' : ''}
    ],
    campos:[
      {k:'titulo', r:'Título', tipo:'text', req:true},
      {k:'texto', r:'Texto', tipo:'textarea', req:true},
      {k:'imagem_path', r:'Imagem (opcional)', tipo:'imagem', pasta:'noticias'},
      {k:'publicada', r:'Publicar no portal', tipo:'checkbox'}
    ],
    extraNovo:() => ({autor: sessao
