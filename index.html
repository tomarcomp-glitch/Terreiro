<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d3b9e">
<title>Terreiro de Umbanda PAI JACÓ DE ARUANDA</title>
<style>
:root{color-scheme:light;--fundo:#f5f9ff;--papel:#ffffff;--texto:#0c1a3d;--suave:#4a5878;--linha:#d3ddef;--verde:#0d3b9e;--sobre:#ffffff;--ouro:#1566c9;--perigo:#a1352a;--ok:#25683f;--foco:#1566c9}
*{box-sizing:border-box}
body{margin:0;background:var(--fundo);color:var(--texto);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;line-height:1.2;margin:0 0 .5rem}
h1{font-size:1.9rem}h2{font-size:1.3rem}
a{color:var(--verde)}
:focus-visible{outline:3px solid var(--foco);outline-offset:2px}
.topo{position:sticky;top:0;z-index:5;background:var(--papel);border-bottom:1px solid var(--linha);display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.6rem 1rem;flex-wrap:wrap}
.marca{display:flex;align-items:center;gap:.65rem;font:700 1.05rem/1.2 Georgia,serif;color:var(--texto);text-decoration:none}
.logo{width:44px;height:44px;border-radius:50%;object-fit:contain;background:#fff;flex:none}
.logo-g{width:132px;height:auto;border-radius:12px;background:#fff;padding:4px;flex:none}
nav{display:flex;gap:.25rem;align-items:center}
nav a,nav .link{padding:.5rem .75rem;border-radius:6px;color:var(--texto);text-decoration:none;min-height:40px;display:inline-flex;align-items:center}
nav a[aria-current]{background:var(--verde);color:var(--sobre)}
.link{background:none;border:0;font:inherit;cursor:pointer;color:var(--verde);padding:0;text-decoration:underline}
nav .link{text-decoration:none;color:var(--texto)}
.menu-btn{display:none}
@media(max-width:720px){.menu-btn{display:inline-block}nav{display:none;width:100%;flex-direction:column;align-items:stretch}nav.aberto{display:flex}}
main{max-width:980px;margin:0 auto;padding:1.25rem 1rem 3rem;outline:none}
.btn{background:var(--verde);color:var(--sobre);border:1px solid var(--verde);border-radius:6px;padding:.6rem 1rem;font:inherit;font-weight:600;cursor:pointer;min-height:40px}
.btn.sec{background:transparent;color:var(--texto);border-color:var(--linha)}
.btn.perigo{background:transparent;color:var(--perigo);border-color:var(--perigo)}
.btn.peq{padding:.3rem .6rem;min-height:34px;font-weight:500}
.btn:disabled{opacity:.6;cursor:wait}
.hero{display:flex;align-items:center;gap:1rem;padding:1.25rem 0 1rem;border-bottom:2px solid var(--ouro);margin-bottom:1.5rem}
.hero p{margin:0;color:var(--suave)}
.duas{display:grid;grid-template-columns:2fr 1fr;gap:2rem}
@media(max-width:760px){.duas{grid-template-columns:1fr}}
.noticia{padding:1rem 0;border-bottom:1px solid var(--linha)}
.noticia:first-of-type{padding-top:0}
.noticia time,.suave{color:var(--suave);font-size:.9rem}
.evento{display:flex;gap:.8rem;padding:.7rem 0;border-bottom:1px solid var(--linha)}
.evento .dia{min-width:3.2rem;text-align:center;font-family:Georgia,serif;line-height:1.1}
.evento .dia b{display:block;font-size:1.5rem;color:var(--ouro)}
.vazio{color:var(--suave);padding:1rem 0}
.aviso-pend{background:var(--papel);border:1px solid var(--ouro);border-left-width:5px;padding:.8rem 1rem;margin-bottom:1.25rem;border-radius:6px}
.cartao{background:var(--papel);border:1px solid var(--linha);border-radius:8px;padding:1.25rem}
.estreito{max-width:420px;margin:1rem auto}
label{display:block;font-weight:600;margin:.8rem 0 .25rem}
input,select,textarea{width:100%;font:inherit;color:var(--texto);background:var(--fundo);border:1px solid var(--linha);border-radius:6px;padding:.55rem .65rem;min-height:40px}
textarea{min-height:130px;resize:vertical}
label.chk{display:flex;gap:.5rem;align-items:center;font-weight:500}
label.chk input{width:auto;min-height:0}
.erro{color:var(--perigo);margin:.6rem 0 0;min-height:1.2em}
.certo{color:var(--ok)}
.abas{display:flex;gap:.25rem;flex-wrap:wrap;border-bottom:1px solid var(--linha);margin-bottom:1rem}
.abas a{padding:.5rem .8rem;text-decoration:none;color:var(--texto);border-bottom:3px solid transparent}
.abas a[aria-current]{border-color:var(--ouro);font-weight:700}
.cab{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:.8rem}
.filtros{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:.8rem}
.filtros input{flex:1;min-width:160px;width:auto}
.rolagem{overflow-x:auto;border:1px solid var(--linha);border-radius:8px;background:var(--papel)}
table{border-collapse:collapse;width:100%;min-width:520px}
th,td{padding:.6rem .75rem;text-align:left;border-bottom:1px solid var(--linha);vertical-align:top}
th{font-size:.85rem;color:var(--suave);font-weight:600;white-space:nowrap}
tr:last-child td{border-bottom:0}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.acoes{white-space:nowrap;text-align:right}
td.ok,td.rec{color:var(--ok);font-weight:600}
td.neg,td.des,tr.alerta td.sit{color:var(--perigo);font-weight:600}
td.rasc{color:var(--suave)}
tr.alerta{background:color-mix(in srgb,var(--perigo) 8%,transparent)}
.totais{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;margin-bottom:.8rem}
.totais div{background:var(--papel);border:1px solid var(--linha);border-radius:8px;padding:.6rem .8rem}
.totais span{display:block;font-size:.85rem;color:var(--suave)}
.totais strong{font-size:1.15rem;font-variant-numeric:tabular-nums}
strong.ok{color:var(--ok)}strong.neg{color:var(--perigo)}
dialog{border:1px solid var(--linha);border-radius:10px;background:var(--papel);color:var(--texto);width:min(520px,calc(100% - 1.5rem));padding:1.25rem;max-height:92vh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.5)}
.rodape{display:flex;gap:.6rem;justify-content:flex-end;margin-top:1rem}
#aviso{position:fixed;left:50%;bottom:1rem;transform:translateX(-50%);background:var(--texto);color:var(--fundo);padding:.6rem 1rem;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:90%}
#aviso.v{opacity:1}#aviso.e{background:var(--perigo);color:#fff}
@media(prefers-reduced-motion:reduce){#aviso{transition:none}}
.img-n{display:block;max-width:100%;max-height:360px;border-radius:8px;margin:.5rem 0}
.img-e{display:block;width:100%;max-height:200px;object-fit:cover;border-radius:6px;margin:.4rem 0}
.prev{display:block;max-width:100%;max-height:160px;border-radius:6px;margin:.4rem 0}
.acoes-n{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.7rem}
.acoes-n .btn{padding:.4rem .85rem}
.btn[aria-pressed=true]{border-color:var(--ouro);color:var(--ouro);font-weight:700}
.presenca{margin-top:.6rem;padding:.6rem .7rem;border:1px solid var(--linha);border-radius:8px;background:var(--fundo)}
.presenca .pr-linha{display:flex;gap:.4rem;align-items:center;flex-wrap:wrap}
.presenca .pr-motivo{margin-top:.4rem}
.presenca .pr-motivo input{margin-bottom:.4rem}
.presenca .pr-msg{margin:.4rem 0 0;font-size:.9rem}
.pr-pend{color:var(--perigo);font-weight:600}
.alerta-pres{background:var(--papel);border:1px solid var(--perigo);border-left-width:5px;border-radius:6px;padding:.7rem 1rem;margin-bottom:1rem}
.lista-pres h3{font-size:1rem;margin:.9rem 0 .2rem}
.lista-pres ul{margin:0;padding-left:1.1rem}
.ajuda{background:var(--fundo);border-left:3px solid var(--ouro);padding:.5rem .7rem;margin:.4rem 0;font-size:.9rem;color:var(--suave);border-radius:4px}
.sec-m{border:1px solid var(--linha);border-radius:8px;padding:.1rem .8rem .8rem;margin-top:.8rem}
.sec-m h3{font-size:1rem;margin:.8rem 0 .2rem}
label.op{align-items:flex-start;margin:.5rem 0}
label.op input{margin-top:.3rem}
label.op span{display:flex;flex-direction:column}
label.op small{font-weight:400;color:var(--suave);line-height:1.35}
.lista-m{list-style:none;margin:.6rem 0 0;padding:0}
.lista-m li{padding:.6rem 0;border-bottom:1px solid var(--linha)}
.lista-m .pr-linha{display:flex;gap:.4rem;margin-top:.3rem}
.lista-m .pr-motivo{margin-top:.4rem;display:flex;gap:.4rem}
.lista-m .pr-motivo[hidden]{display:none}
@media print{.topo,.btn,.filtros,.abas,.acoes{display:none!important}}
.topo{background:rgba(255,255,255,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--linha);box-shadow:0 2px 10px rgba(13,59,158,.06)}
.hero{position:relative;border-bottom:1px solid var(--linha)!important;margin-bottom:2rem}
h1,h2{color:var(--verde)}
@media print{</style>

function comprimir(file, max = 1280, q = 0.8) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const f = Math.min(1, max / Math.max(img.width, img.height));
      const w = Math.round(img.width * f), h = Math.round(img.height * f);
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); x.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      c.toBlob(b => b ? res(b) : rej(new Error('Não foi possível processar a imagem.')), 'image/jpeg', q);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Arquivo de imagem inválido.')); };
    img.src = url;
  });
}

async function enviarImagem(file, pasta) {
  const blob = await comprimir(file);
  const id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(36).slice(2);
  const path = `${pasta}/${id}.jpg`;
  const {error} = await sb.storage.from('imagens').upload(path, blob, {contentType:'image/jpeg', cacheControl:'3600'});
  if (error) throw error;
  return path;
}

async function apagarImagens(caminhos) {
  const lista = caminhos.filter(Boolean);
  if (!lista.length) return true;
  const {error} = await sb.storage.from('imagens').remove(lista);
  return !error;
}

let limpou = false;
async function limparEventosEncerrados() {
  if (limpou) return;
  limpou = true;
  const {data, error} = await sb.from('eventos').select('id,imagem_path').lt('data_hora', new Date().toISOString()).not('imagem_path', 'is', null);
  if (error || !data || !data.length) return;
  if (!(await apagarImagens(data.map(e => e.imagem_path)))) { limpou = false; return; }
  const r = await sb.from('eventos').update({imagem_path: null}).in('id', data.map(e => e.id));
  if (!r.error) aviso(data.length + (data.length === 1 ? ' imagem de evento encerrado foi apagada.' : ' imagens de eventos encerrados foram apagadas.'));
}

function msgErro(e) {
  const m = (e && e.message) || String(e || '');
  if (/Invalid login credentials/i.test(m)) return 'E-mail ou senha incorretos.';
  if (/Email not confirmed/i.test(m)) return 'Confirme seu e-mail antes de entrar (veja a caixa de entrada e o spam).';
  if (/already registered/i.test(m)) return 'Este e-mail já tem cadastro. Use "Entrar".';
  if (/Password should be at least/i.test(m)) return 'A senha precisa ter pelo menos 6 caracteres.';
  if (/rate limit/i.test(m)) return 'Muitas tentativas. Aguarde alguns minutos e tente de novo.';
  if (e && e.code === '23503') return 'Este registro está em uso em outra tela e não pode ser excluído.';
  if (/row-level security|permission denied/i.test(m)) return 'Você não tem permissão para esta ação.';
  if (e && e.code === '23514') return 'Informe o motivo de não ir.';
  if (e && e.code === '23505') return /curtidas/.test(m) ? 'Você já curtiu esta notícia.' : /usuario_id/.test(m) ? 'Esta conta do site já está vinculada a outro cadastro.' : 'Este registro já existe.';
  if (/exceeded the maximum allowed size|too large/i.test(m)) return 'A imagem é grande demais.';
  if (/Failed to fetch|NetworkError/i.test(m)) return 'Sem conexão com o servidor. Verifique a internet.';

async function minhasCurtidas() {
  if (!sessao) return new Set();
  const {data} = await sb.from('curtidas').select('noticia_id');
  return new Set((data || []).map(x => x.noticia_id));
}

function cartaoNoticia(x, curtidas, solo) {
  const c = curtidas.has(x.id), t = solo ? 'h1' : 'h3';
  const tit = solo ? esc(x.titulo) : `<a href="#/noticia/${x.id}" style="color:inherit;text-decoration:none">${esc(x.titulo)}</a>`;
  return `<article class="noticia"><${t}>${tit}</${t}><time>${dataBR(x.criado_em)}</time>${imgTag(x.imagem_path, 'img-n')}<p>${texto(x.texto)}</p>
    <div class="acoes-n"><button class="btn sec" data-acao="curtir" data-id="${x.id}" aria-pressed="${c}"><span class="ic" aria-hidden="true">${c ? '♥' : '♡'}</span> Gostei · <span class="n">${x.curtidas || 0}</span></button><button class="btn sec" data-acao="compartilhar" data-id="${x.id}" data-titulo="${esc(x.titulo)}">Compartilhar</button></div></article>`;
}

async function alternarCurtida(b) {
  if (!sessao) { aviso('Entre na sua conta para curtir.', true); return; }
  if (!perfil || perfil.papel === 'pendente') { aviso('Seu cadastro ainda aguarda a aprovação do administrador.', true); return; }
  if (b.disabled) return;
  b.disabled = true;
  const id = Number(b.dataset.id), curtido = b.getAttribute('aria-pressed') === 'true';
  const r = curtido
    ? await sb.from('curtidas').delete().eq('noticia_id', id).eq('usuario_id', sessao.user.id)
    : await sb.from('curtidas').insert({noticia_id: id, usuario_id: sessao.user.id});
  b.disabled = false;
  if (r.error) { aviso(msgErro(r.error), true); return; }
  const n = b.querySelector('.n');
  n.textContent = Math.max(0, Number(n.textContent) + (curtido ? -1 : 1));
  b.setAttribute('aria-pressed', String(!curtido));
  b.querySelector('.ic').textContent = curtido ? '♡' : '♥';
}

async function compartilhar(id, titulo) {
  const url = location.origin + location.pathname + '#/noticia/' + id;
  if (navigator.share) {
    try { await navigator.share({title: titulo, text: titulo + ' · ' + CONFIG.nome, url}); return; }
    catch (e) { if (e && e.name === 'AbortError') return; }
  }
  try { await navigator.clipboard.writeText(url); aviso('Link copiado.'); }
  catch (e) { window.prompt('Copie o link:', url); }
}

async function viewNoticia(id) {

  if (n.error) { app.innerHTML = `<p class="erro">${esc(msgErro(n.error))}</p>`; return; }
  if (!n.data) { app.innerHTML = '<h1>Notícia não encontrada</h1><p>Ela pode ter sido removida.</p><p><a href="#/">Voltar ao início</a></p>'; return; }
  document.title = n.data.titulo + ' · ' + CONFIG.nome;
  app.innerHTML = `<p><a href="#/">← Todas as notícias</a></p>${cartaoNoticia(n.data, curtidas, true)}`;
}

async function minhasPresencas() {
  if (!sessao || !perfil || !perfil.membro_id) return new Map();
  const {data} = await sb.from('presencas').select('evento_id,vai,motivo').eq('membro_id', perfil.membro_id);
  return new Map((data || []).map(x => [x.evento_id, x]));
}

const msgPresenca = r => !r ? 'Você ainda não respondeu.' : r.vai ? 'Presença confirmada.' : 'Registrado: você não irá.';

function widgetPresenca(x, resp) {
  if (!x.pede_presenca || !sessao || !perfil || !perfil.membro_id || !resp) return '';
  const r = resp.get(x.id);
  return `<div class="presenca"><div class="pr-linha"><strong>Sua presença:</strong>
    <button class="btn sec peq" data-acao="irei" data-id="${x.id}" aria-pressed="${!!(r && r.vai)}">Irei</button>
    <button class="btn sec peq" data-acao="naoirei" data-id="${x.id}" aria-pressed="${!!(r && !r.vai)}">Não irei</button></div>
    <div class="pr-motivo"${r && !r.vai ? '' : ' hidden'}><label for="mot_${x.id}">Motivo (obrigatório)</label><input id="mot_${x.id}" maxlength="200" value="${esc(r && !r.vai ? r.motivo : '')}"><button class="btn peq" data-acao="salvar-motivo" data-id="${x.id}">Salvar motivo</button></div>
    <p class="pr-msg ${r ? 'suave' : 'pr-pend'}">${msgPresenca(r)}</p></div>`;
}

async function salvarPresenca(id, vai, motivo, wrap) {
  if (!sessao || !perfil || !perfil.membro_id) return;
  const botoes = wrap.querySelectorAll('button');
  botoes.forEach(b => { b.disabled = true; });
  const {error} = await sb.from('presencas').upsert(
    {evento_id: id, membro_id: perfil.membro_id, vai, motivo: vai ? null : motivo, atualizado_em: new Date().toISOString()},
    {onConflict: 'evento_id,membro_id'});
  botoes.forEach(b => { b.disabled = false; });
  if (error) { aviso(msgErro(error), true); return; }
  wrap.querySelector('[data-acao=irei]').setAttribute('aria-pressed', String(vai));
  wrap.querySelector('[data-acao=naoirei]').setAttribute('aria-pressed', String(!vai));
  wrap.querySelector('.pr-motivo').hidden = vai;
  const m = wrap.querySelector('.pr-msg');
  m.textContent = msgPresenca({vai, motivo}); m.className = 'pr-msg suave';
  aviso('Resposta registrada.');
}

async function resumoPresencas() {
  const [ev, mm, pr] = await Promise.all([
    sb.from('eventos').select('id,titulo,data_hora').eq('pede_presenca', true).gte('data_hora', new Date().toISOString()).order('data_hora'),
    sb.from('membros').select('id,nome,usuario_id').eq('tipo', 'medium').order('nome'),
    sb.from('presencas').select('evento_id,membro_id,vai,motivo')
  ]);
  if (ev.error || mm.error || pr.error) return null;
  const porEvento = {}, pendentes = new Set();
  ev.data.forEach(e => {
    const resp = {};
    pr.data.filter(x => x.evento_id === e.id).forEach(x => { resp[x.membro_id] = x; });
    const linhas = mm.data.map(m => ({id: m.id, nome: m.nome, semConta: !m.usuario_id, vai: resp[m.id] ? resp[m.id].vai : null, motivo: resp[m.id] ? resp[m.id].motivo : null}));
    const sem = linhas.filter(l => l.vai === null);
    sem.forEach(l => pendentes.add(l.id));
    porEvento[e.id] = {linhas, irao: linhas.filter(l => l.vai === true), nao: linhas.filter(l => l.vai === false), sem};
  });
  return {porEvento, membrosPendentes: pendentes.size, eventosComPendencia: Object.values(porEvento).filter(x => x.sem.length).length};
}

async function preencherAlerta() {
  if (!perfil || perfil.papel !== 'admin') return;
  const r = await resumoPresencas();
  const el = $('#alertaPres');
  if (!el || !r || !r.eventosComPendencia) return;
  el.innerHTML = `<div class="alerta-pres" role="alert"><strong>Presenças sem resposta:</strong> ${r.membrosPendentes} membro(s) ainda não decidiram em ${r.eventosComPendencia} evento(s). <a href="#/admin/eventos">Ver respostas</a></div>`;
}

async function abrirRespostas(ev, aoMudar) {
  const d = $('#dlg');
  let mudou = false;
  d.innerHTML = `<h2 id="dlgT">Presenças: ${esc(ev.titulo)}</h2><div id="corpoPres"><p class="vazio">Carregando…</p></div><div class="rodape"><button class="btn" id="fechar" type="button">Fechar</button></div>`;
  d.showModal();
  $('#fechar').onclick = () => d.close();
  d.onclose = () => { d.onclick = null; d.onclose = null; if (mudou && aoMudar) aoMudar(); };
  const status = l => l.vai === null ? 'sem resposta' : l.vai ? 'irá' : 'não irá — ' + l.motivo;
  const desenhar = async () => {
    const r = await resumoPresencas(), x = r && r.porEvento[ev.id], c = $('#corpoPres');
    if (!c) return;
    if (!x) { c.innerHTML = '<p class="suave">Este evento não pede confirmação de presença ou já aconteceu.</p>'; return; }
    if (!x.linhas.length) { c.innerHTML = '<p class="suave">Nenhum médium cadastrado ainda.</p>'; return; }
    c.innerHTML = `<p class="suave">Irão ${x.irao.length} · Não irão ${x.nao.length} · Sem resposta ${x.sem.length}. Quem não tem conta no site não consegue responder: registre por essa pessoa aqui.</p><ul class="lista-m">`
      + [...x.sem, ...x.nao, ...x.irao].map(l => `<li data-m="${l.id}"><div><strong>${esc(l.nome)}</strong>${l.semConta ? ' <span class="suave">(sem conta)</span>' : ''}<br><span class="${l.vai === null ? 'pr-pend' : 'suave'}">${esc(status(l))}</span></div>
        <div class="pr-linha"><button class="btn sec peq" data-r="sim" aria-pressed="${l.vai === true}">Irá</button><button class="btn sec peq" data-r="nao" aria-pressed="${l.vai === false}">Não irá</button></div>
        <div class="pr-motivo" hidden><input maxlength="200" placeholder="Motivo (obrigatório)" aria-label="Motivo"><button class="btn peq" data-r="salvar">Salvar</button></div></li>`).join('') + '</ul>';
  };
  d.onclick = async e => {
    const b = e.target.closest('button[data-r]'); if (!b) return;
    const li = b.closest('li'), mid = Number(li.dataset.m);
    if (b.dataset.r === 'nao') { li.querySelector('.pr-motivo').hidden = false; li.querySelector('input').focus(); return; }
    let vai = b.dataset.r === 'sim', motivo = null;
    if (b.dataset.r === 'salvar') {
      motivo = li.querySelector('input').value.trim();
      if (!motivo) { aviso('Informe o motivo.', true); return; }
      vai = false;
    }
    const {error} = await sb.from('presencas').upsert({evento_id: ev.id, membro_id: mid, vai, motivo, atualizado_em: new Date().toISOString()}, {onConflict: 'evento_id,membro_id'});
    if (error) { aviso(msgErro(error), true); return; }
    mudou = true; aviso('Resposta registrada.'); desenhar();
  };
  desenhar();
}

function blocoEvento(x, resp) {
  const d = new Date(x.data_hora);
  const mes = d.toLocaleDateString('pt-BR', {month:'short'}).replace('.', '');
  return `<div class="evento"><div class="dia"><b>${d.getDate()}</b>${esc(mes)}</div><div><strong>${esc(x.titulo)}</strong>${x.publico ? '' : ' <span class="suave">(só membros)</span>'}<br><span class="suave">${d.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'})}${x.local ? ' · ' + esc(x.local) : ''}</span>${imgTag(x.imagem_path, 'img-e')}${x.descricao ? '<br>' + texto(x.descricao) : ''}${widgetPresenca(x, resp)}</div></div>`;
}

async function viewAgenda() {
  app.innerHTML = '<h1>Agenda</h1><p class="vazio">Carregando…</p>';
  const {data, error} = await sb.from('eventos').select('*').gte('data_hora', new Date().toISOString()).order('data_hora');
  const presencas = await minhasPresencas();
  const corpo = error ? `<p class="erro">${esc(msgErro(error))}</p>`
    : !data.length ? '<p class="vazio">Nenhum evento agendado por enquanto.</p>'
    : data.map(x => blocoEvento(x, presencas)).join('');
  const dica = sessao ? '' : '<p class="suave">Entre com sua conta de membro para ver também os eventos internos.</p>';
  app.innerHTML = `<h1>Agenda</h1>${dica}${corpo}`;
}

function viewEntrar() {
  app.innerHTML = `<div class="cartao estreito"><h1 id="tit">Entrar</h1>
    <form id="frmL" novalidate>
      <div id="campoNome" hidden><label for="nome">Seu nome</label><input id="nome" autocomplete="name"></div>
      <label for="email">E-mail</label><input id="email" type="email" autocomplete="email" inputmode="email">
      <label for="senha">Senha</label><input id="senha" type="password" autocomplete="current-password">
      <p class="erro" id="erroL" role="alert"></p>
      <button class="btn" id="env" style="width:100%;margin-top:.6rem">Entrar</button>
    </form>
    <p class="suave"><span id="txtAlt">Ainda não tem cadastro?</span> <button class="link" id="alt" type="button">Criar conta</button></p></div>`;
  let cadastro = false;
  const msg = (t, ok) => { const p = $('#erroL'); p.textContent = t; p.className = 'erro' + (ok ? ' certo' : ''); };
  $('#alt').onclick = () => {
    cadastro = !cadastro; msg('');
    $('#tit').textContent = cadastro ? 'Criar conta' : 'Entrar';
    $('#env').textContent = cadastro ? 'Criar conta' : 'Entrar';
    $('#txtAlt').textContent = cadastro ? 'Já tem cadastro?' : 'Ainda não tem cadastro?';
    $('#alt').textContent = cadastro ? 'Entrar' : 'Criar conta';
    $('#campoNome').hidden = !cadastro;
    $('#senha').autocomplete = cadastro ? 'new-password' : 'current-password';
  };
  $('#frmL').onsubmit = async ev => {
    ev.preventDefault();
    const email = $('#email').value.trim(), senha = $('#senha').value, nome = $('#nome').value.trim();
    if (cadastro && !nome) { msg('Informe seu nome.'); $('#nome').focus(); return; }
    if (!email) { msg('Informe seu e-mail.'); $('#email').focus(); return; }
    if (senha.length < 6) { msg('A senha precisa ter pelo menos 6 caracteres.'); $('#senha').focus(); return; }
    const btn = $('#env'); btn.disabled = true; msg('');
    if (cadastro) {
      const {data, error} = await sb.auth.signUp({email, password: senha, options: {data: {nome}}});
      btn.disabled = false;
      if (error) { msg(msgErro(error)); return; }
      if (data.session) { location.hash = '#/'; return; }
      msg('Cadastro criado. Enviamos um link de confirmação para o seu e-mail. Confirme e depois entre.', true);
    } else {
      const {error} = await sb.auth.signInWithPassword({email, password: senha});
      btn.disabled = false;
      if (error) { msg(msgErro(error)); return; }
      location.hash = '#/';
    }
  };
  $('#email').focus();
}

        opcoes: async () => { const {data} = await sb.from('membros').select('id,nome').order('nome'); return (data || []).map(x => ({v:x.id, t:x.nome})); }}
    ],
    resumo: rs => {
      let rec = 0, des = 0;
      rs.forEach(x => { const c = Math.round(Number(x.valor) * 100); if (x.tipo === 'receita') rec += c; else des += c; });
      return `<div class="totais"><div><span>Receitas</span><strong class="ok">${brl(rec / 100)}</strong></div><div><span>Despesas</span><strong class="neg">${brl(des / 100)}</strong></div><div><span>Saldo</span><strong class="${rec >= des ? 'ok' : 'neg'}">${brl((rec - des) / 100)}</strong></div></div>`;
    }
  },
  estoque: {
    aba:'#/admin/estoque', tabela:'estoque', titulo:'Estoque', singular:'item', botao:'Novo item',
    vazio:'Nenhum item no estoque. Cadastre o primeiro material.',
    ordem:['item', true], busca:['item'], nome:r => r.item,
    destaque: r => Number(r.minimo) > 0 && Number(r.quantidade) <= Number(r.minimo),
    colunas:[
      {r:'Item', fmt:r => r.item},
      {r:'Quantidade', num:true, fmt:r => `${r.quantidade ?? 0} ${r.unidade || ''}`.trim()},
      {r:'Mínimo', num:true, fmt:r => String(r.minimo ?? 0)},
      {r:'Situação', fmt:r => (Number(r.minimo) > 0 && Number(r.quantidade) <= Number(r.minimo)) ? 'Repor' : 'Ok', cls:() => 'sit'}
    ],
    campos:[
      {k:'item', r:'Item', tipo:'text', req:true},
      {k:'quantidade', r:'Quantidade em estoque', tipo:'number', padrao:0, min:0},
      {k:'unidade', r:'Unidade (ex.: un, kg, maço)', tipo:'text'},
      {k:'minimo', r:'Quantidade mínima (avisa para repor)', tipo:'number', padrao:0, min:0}
    ]
  }
};

async function abrirForm(cfg, row, aoSalvar) {
  const novo = !row, r = row || {};
  const ops = {};
  for (const c of cfg.campos) if (c.tipo === 'select') ops[c.k] = typeof c.opcoes === 'function' ? await c.opcoes() : c.opcoes;
  const campo = c => {
    const pad = typeof c.padrao === 'function' ? c.padrao() : c.padrao;
    const v = novo ? pad : r[c.k];
    const id = 'f_' + c.k;
    if (c.tipo === 'checkbox') return `<label class="chk"><input type="checkbox" id="${id}"${v ? ' checked' : ''}>${esc(c.r)}</label>`;
    if (c.tipo === 'imagem') {
      const atual = r[c.k] ? `<img class="prev" src="${esc(imgUrl(r[c.k]))}" alt="Imagem atual">` : '';
      const apaga = c.pasta === 'eventos' ? 'o evento termina ou é excluído' : 'a notícia é excluída';
      return `<label for="${id}">${esc(c.r)}</label>${atual}<input id="${id}" type="file" accept="image/*">${r[c.k] ? `<label class="chk"><input type="checkbox" id="${id}_rm">Remover a imagem atual</label>` : ''}<p class="suave">A imagem é reduzida automaticamente e apagada quando ${apaga}.</p>`;
    }
    const rot = `<label for="${id}">${esc(c.r)}${c.req ? ' *' : ''}</label>`;
    if (c.tipo === 'textarea') return `${rot}<textarea id="${id}">${esc(v ?? '')}</textarea>`;
    if (c.tipo === 'select') return `${rot}<select id="${id}">${c.req ? '' : '<option value=""></option>'}${ops[c.k].map(o => `<option value="${esc(o.v)}"${String(o.v) === String(v ?? '') ? ' selected' : ''}>${esc(o.t)}</option>`).join('')}</select>`;
    const tipo = c.tipo === 'datetime' ? 'datetime-local' : c.tipo;
    const val = c.tipo === 'datetime' ? paraLocal(v) : (v ?? '');
    const extra = c.tipo === 'number' ? ' step="any" inputmode="decimal"' + (c.min !== undefined ? ` min="${c.min}"` : '') : '';
    return `${rot}<input id="${id}" type="${tipo}" value="${esc(val)}"${extra}>`;
  };
  const d = $('#dlg');
  d.innerHTML = `<form id="frm" novalidate><h2 id="dlgT">${novo ? esc(cfg.botao) : 'Editar ' + esc(cfg.singular)}</h2>${cfg.campos.map(campo).join('')}<p class="erro" id="erroF" role="alert"></p><div class="rodape"><button type="button" class="btn sec" id="cancelar">Cancelar</button><button class="btn" id="salvar">Salvar ${esc(cfg.singular)}</button></div></form>`;
  d.showModal();
  const primeiro = d.querySelector('input,textarea,select'); if (primeiro) primeiro.focus();
  $('#cancelar').onclick = () => d.close();
  const erro = t => { $('#erroF').textContent = t; };
  $('#frm').onsubmit = async ev => {
    ev.preventDefault();
    const obj = {};
    let arquivo = null;
    for (const c of cfg.campos) {
      const el = $('#f_' + c.k);
      if (c.tipo === 'imagem') {
        const rm = $('#f_' + c.k + '_rm');
        if (el.files && el.files[0]) arquivo = el.files[0];
        else if (rm && rm.checked) obj[c.k] = null;
        continue;
      }
      if (c.tipo === 'checkbox') { obj[c.k] = el.checked; continue; }
      let v = el.value.trim();
      if (!v) {
        if (c.req) { erro(`Preencha o campo "${c.r}".`); el.focus(); return; }
        obj[c.k] = null; continue;
      }
      if (c.tipo === 'number') {
        v = Number(v);
        if (isNaN(v) || (c.min !== undefined && v < c.min)) { erro(`Valor inválido em "${c.r}".`); el.focus(); return; }
      } else if (c.tipo === 'datetime') {
        v = new Date(v).toISOString();
      } else if (c.int) {
        v = Number(v);
      }
      obj[c.k] = v;
    }
    const btn = $('#salvar'); btn.disabled = true; erro('');
    const ci = cfg.campos.find(c => c.tipo === 'imagem');
    let enviada = null, antiga = null;
    if (ci && arquivo) {
      try { enviada = await enviarImagem(arquivo, ci.pasta); }
      catch (e) { erro(msgErro(e)); btn.disabled = false; return; }
      obj[ci.k] = enviada;
    }
    if (ci && !novo && r[ci.k] && (enviada || obj[ci.k] === null)) antiga = r[ci.k];
    const res = novo
      ? await sb.from(cfg.tabela).insert({...obj, ...(cfg.extraNovo ? cfg.extraNovo() : {})}).select()
      : await sb.from(cfg.tabela).update(obj).eq('id', r.id).select();
    if (res.error || !res.data || !res.data.length) {
      if (enviada) await apagarImagens([enviada]);
      erro(res.error ? msgErro(res.error) : 'Não foi possível salvar. Verifique se você ainda está logado como administrador.');
      btn.disabled = false; return;
    }
    if (antiga) await apagarImagens([antiga]);
    d.close(); aviso('Salvo.'); aoSalvar();
  };
}

async function viewCrud(cfg) {
  const mesPad = hoje().slice(0, 7);
  app.innerHTML = abas(cfg.aba) + '<div id="alertaPres"></div>' + `<div class="cab"><h1>${esc(cfg.titulo)}</h1><button class="btn" id="novo">${esc(cfg.botao)}</button></div>
    <div class="filtros"><input id="busca" type="search" placeholder="Buscar" aria-label="Buscar">${cfg.filtroMes ? `<input id="mes" type="month" value="${mesPad}" aria-label="Filtrar por mês" style="max-width:190px">` : ''}</div>
    <div id="resumo"></div><div id="lista"><p class="vazio">Carregando…</p></div>`;
  preencherAlerta();
  let linhas = [], ctx = {};
  const filtradas = () => {
    const q = norm($('#busca').value), mes = cfg.filtroMes ? $('#mes').value : '';
    return linhas.filter(r => (!q || cfg.busca.some(k => norm(r[k]).includes(q))) && (!mes || String(r[cfg.filtroMes]).startsWith(mes)));
  };
  const desenhar = () => {
    const rs = filtradas();
    if (cfg.resumo) $('#resumo').innerHTML = cfg.resumo(rs);
    if (!linhas.length) { $('#lista').innerHTML = `<p class="vazio">${esc(cfg.vazio)}</p>`; return; }
    if (!rs.length) { $('#lista').innerHTML = '<p class="vazio">Nada encontrado com esse filtro.</p>'; return; }
    $('#lista').innerHTML = `<div class="rolagem"><table><thead><tr>${cfg.colunas.map(c => `<th class="${c.num ? 'num' : ''}">${esc(c.r)}</th>`).join('')}<th></th></tr></thead><tbody>`
      + rs.map(r => `<tr class="${cfg.destaque && cfg.destaque(r) ? 'alerta' : ''}">`
        + cfg.colunas.map(c => `<td class="${c.num ? 'num ' : ''}${c.cls ? c.cls(r, ctx) : ''}">${esc(c.fmt(r, ctx))}</td>`).join('')
        + `<td class="acoes">${cfg.respostas ? `<button class="btn sec peq" data-a="r" data-id="${r.id}">Respostas</button> ` : ''}<button class="btn sec peq" data-a="e" data-id="${r.id}">Editar</button> <button class="btn perigo peq" data-a="x" data-id="${r.id}">Excluir</button></td></tr>`).join('')
      + '</tbody></table></div>';
  };
  const carregar = async () => {
    if (cfg.antes) ctx = await cfg.antes();
    const {data, error} = await sb.from(cfg.tabela).select('*').order(cfg.ordem[0], {ascending:cfg.ordem[1]});
    if (error) { $('#lista').innerHTML = `<p class="erro">${esc(msgErro(error))}</p>`; return; }
    linhas = data; desenhar();
  };
  $('#novo').onclick = () => abrirForm(cfg, null, carregar);
  $('#busca').oninput = desenhar;
  if (cfg.filtroMes) $('#mes').oninput = desenhar;
  $('#lista').onclick = async ev => {
    const b = ev.target.closest('button[data-a]'); if (!b) return;
    const row = linhas.find(x => String(x.id) === b.dataset.id); if (!row) return;
    if (b.dataset.a === 'r') { abrirRespostas(row, carregar); return; }
    if (b.dataset.a === 'e') { abrirForm(cfg, row, carregar); return; }
    if (!(await confirmar(`Excluir "${cfg.nome(row)}"? Esta ação não pode ser desfeita.`, 'Excluir ' + cfg.singular))) return;
    const {data, error} = await sb.from(cfg.tabela).delete().eq('id', row.id).select();
    if (error || !data || !data.length) { aviso(error ? msgErro(error) : 'Não foi possível excluir.', true); return; }
    if (row.imagem_path && !(await apagarImagens([row.imagem_path]))) aviso('Excluído, mas a imagem não pôde ser apagada do armazenamento.', true);
    else aviso('Excluído.');
    carregar();
  };
  carregar();
}


/* ---------- Cadastro de pessoas (Membros) ---------- */

const ROTULO_ACESSO = {pendente:'aguardando', consulente:'consulente', membro:'médium', admin:'administrador'};

function resumoPessoa(m) {
  const T = TERMOS, rot = k => (T.funcoes[k] || T.cargos[k] || {r:k}).r;
  const f = (m.funcoes || []).map(rot);
  if (m.tipo === 'medium') return [...f, m.grau ? T.graus[m.grau].r : null].filter(Boolean).join(' · ');
  return f.join(' · ');
}

async function viewMembros() {
  const T = TERMOS;
  app.innerHTML = abas('#/admin/membros') + `<div id="alertaPres"></div><div class="cab"><h1>Membros</h1><button class="btn" id="novo">Novo cadastro</button></div>
    <p class="suave">Cadastro único de todas as pessoas da casa: administradores, médiuns e consulentes. O acesso ao site segue o tipo do cadastro.</p>
    <div id="contas"></div>
    <div class="filtros"><input id="busca" type="search" placeholder="Buscar por nome ou telefone" aria-label="Buscar">
    <select id="ftipo" aria-label="Filtrar por tipo" style="max-width:200px"><option value="">Todos os tipos</option>${Object.entries(T.tipos).map(([k, v]) => `<option value="${k}">${esc(v.r)}</option>`).join('')}</select></div>
    <div id="lista"><p class="vazio">Carregando…</p></div>`;
  preencherAlerta();
  let linhas = [], contas = [];
  const desenhar = () => {
    $('#contas').innerHTML = contas.length
      ? `<div class="aviso-pend"><strong>Contas do site sem cadastro (${contas.length})</strong><ul style="margin:.4rem 0 0;padding-left:1.1rem">${contas.map(c => `<li>${esc(c.nome || '(sem nome)')} <span class="suave">· acesso atual: ${ROTULO_ACESSO[c.papel] || c.papel}</span> <button class="btn peq" data-c="${c.id}">Cadastrar</button></li>`).join('')}</ul></div>` : '';
    const q = norm($('#busca').value), t = $('#ftipo').value;
    const rs = linhas.filter(m => (!q || norm(m.nome).includes(q) || norm(m.telefone).includes(q)) && (!t || m.tipo === t));
    if (!linhas.length) { $('#lista').innerHTML = '<p class="vazio">Nenhum cadastro ainda. Toque em "Novo cadastro" para incluir a primeira pessoa.</p>'; return; }
    if (!rs.length) { $('#lista').innerHTML = '<p class="vazio">Nada encontrado com esse filtro.</p>'; return; }
    $('#lista').innerHTML = `<div class="rolagem"><table><thead><tr><th>Nome</th><th>Tipo</th><th>Função e grau</th><th>Acesso ao site</th><th></th></tr></thead><tbody>`
      + rs.map(m => `<tr><td>${esc(m.nome)}${m.telefone ? `<br><span class="suave">${esc(m.telefone)}</span>` : ''}</td><td>${esc(T.tipos[m.tipo] ? T.tipos[m.tipo].r : m.tipo)}</td><td>${esc(resumoPessoa(m))}</td><td>${m.usuario_id ? ((m.tipo === 'administrador' || m.acesso_admin) ? 'Com conta (admin)' : 'Com conta') : 'Sem conta'}</td>
        <td class="acoes"><button class="btn sec peq" data-a="e" data-id="${m.id}">Editar</button> <button class="btn perigo peq" data-a="x" data-id="${m.id}">Excluir</button></td></tr>`).join('')
      + '</tbody></table></div>';
  };
  const carregar = async () => {
    const [m, p] = await Promise.all([sb.from('membros').select('*').order('nome'), sb.from('profiles').select('id,nome,papel').order('criado_em', {ascending:false})]);
    if (m.error) { $('#lista').innerHTML = `<p class="erro">${esc(msgErro(m.error))}</p>`; return; }
    linhas = m.data;
    const usados = new Set(linhas.map(x => x.usuario_id).filter(Boolean));
    contas = (p.data || []).filter(x => !usados.has(x.id));
    desenhar();
  };
  $('#novo').onclick = () => abrirFormMembro(null, null, carregar);
  $('#busca').oninput = desenhar;
  $('#ftipo').onchange = desenhar;
  $('#contas').onclick = ev => {
    const b = ev.target.closest('button[data-c]'); if (!b) return;
    const c = contas.find(x => x.id === b.dataset.c); if (!c) return;
    abrirFormMembro(null, {nome: c.nome, usuario_id: c.id}, carregar);
  };
  $('#lista').onclick = async ev => {
    const b = ev.target.closest('button[data-a]'); if (!b) return;
    const row = linhas.find(x => String(x.id) === b.dataset.id); if (!row) return;
    if (b.dataset.a === 'e') { abrirFormMembro(row, null, carregar); return; }
    if (!(await confirmar(`Excluir o cadastro de "${row.nome}"? Esta ação não pode ser desfeita. Se houver conta do site vinculada, ela volta a ficar "aguardando".`, 'Excluir cadastro'))) return;
    const {data, error} = await sb.from('membros').delete().eq('id', row.id).select();
    if (error || !data || !data.length) { aviso(error ? msgErro(error) : 'Não foi possível excluir.', true); return; }
    aviso('Excluído.'); carregar();
  };
  carregar();
}

async function abrirFormMembro(row, pre, aoSalvar) {
  const T = TERMOS, novo = !row, r = row || pre || {}, f = r.funcoes || [];
  const [pf, ms] = await Promise.all([
    sb.from('profiles').select('id,nome,papel').order('nome'),
    sb.from('membros').select('usuario_id').not('usuario_id', 'is', null)
  ]);
  const usados = new Set((ms.data || []).map(x => x.usuario_id));
  const contasLivres = (pf.data || []).filter(p => !usados.has(p.id) || p.id === r.usuario_id);
  const pick = (o, ks) => Object.fromEntries(ks.map(k => [k, o[k]]));
  const grupo = (nome, itens, marcados, tipo) => Object.entries(itens).map(([k, v]) =>
    `<label class="chk op"><input type="${tipo || 'checkbox'}" name="${nome}" value="${k}"${marcados.includes(k) ? ' checked' : ''}><span><strong>${esc(v.r)}</strong><small>${esc(v.d)}</small></span></label>`).join('');
  const d = $('#dlg');
  d.innerHTML = `<form id="frm" novalidate><h2 id="dlgT">${novo ? 'Novo cadastro' : 'Editar cadastro'}</h2>
    <label for="m_nome">Nome *</label><input id="m_nome" value="${esc(r.nome || '')}" autocomplete="off">
    <label for="m_tipo">Tipo de cadastro *</label>
    <select id="m_tipo"><option value="">Selecione…</option>${Object.entries(T.tipos).map(([k, v]) => `<option value="${k}"${r.tipo === k ? ' selected' : ''}>${esc(v.r)}</option>`).join('')}</select>
    <p class="ajuda" id="exTipo"></p>
    <div class="sec-m" id="sec_administrador" hidden><h3>Função</h3>${grupo('f_adm', pick(T.funcoes, ['colaborador']), f.length ? f : ['colaborador'])}</div>
    <div class="sec-m" id="sec_medium" hidden>
      <p class="ajuda">${esc(T.aviso)}</p>
      <h3>Funções na corrente</h3>${grupo('f_med', pick(T.funcoes, ['curimba', 'cambone', 'incorporante']), f)}
      <h3>Cargos de liderança</h3>${grupo('f_cargo', T.cargos, f)}
      <h3>Grau mediúnico</h3>
      <select id="m_grau" aria-label="Grau mediúnico"><option value="">Não informado</option>${Object.entries(T.graus).map(([k, v]) => `<option value="${k}"${String(r.grau) === k ? ' selected' : ''}>${esc(v.r)}</option>`).join('')}</select>
      <p class="ajuda" id="exGrau"></p>
      <label class="chk op"><input type="checkbox" id="m_acesso"${r.acesso_admin ? ' checked' : ''}><span><strong>Acesso de administrador no site</strong><small>Libera o painel completo (cadastros, financeiro, estoque). Marque apenas para quem administra a casa, como o dirigente.</small></span></label>
    </div>
    <div class="sec-m" id="sec_consulente" hidden><h3>Função</h3>${grupo('f_con', pick(T.funcoes, ['contribuinte', 'nao_contribuinte']), f, 'radio')}</div>
    <label for="m_tel">Telefone</label><input id="m_tel" type="tel" value="${esc(r.telefone || '')}" inputmode="tel">
    <label for="m_nasc">Data de nascimento</label><input id="m_nasc" type="date" value="${esc(r.nascimento || '')}">
    <label for="m_entr">Data de entrada na casa</label><input id="m_entr" type="date" value="${esc(r.data_entrada || '')}">
    <label for="m_obs">Observações (internas)</label><textarea id="m_obs">${esc(r.observacoes || '')}</textarea>
    <label for="m_conta">Conta de acesso ao site</label>
    <select id="m_conta"><option value="">Sem conta (apenas cadastro)</option>${contasLivres.map(c => `<option value="${c.id}"${c.id === r.usuario_id ? ' selected' : ''}>${esc(c.nome || '(sem nome)')} — acesso atual: ${ROTULO_ACESSO[c.papel] || c.papel}</option>`).join('')}</select>
    <p class="ajuda">Ao vincular uma conta, o acesso dela ao site passa a seguir o tipo escolhido acima.</p>
    <p class="erro" id="erroF" role="alert"></p>
    <div class="rodape"><button type="button" class="btn sec" id="cancelar">Cancelar</button><button class="btn" id="salvar">Salvar cadastro</button></div></form>`;
  const atualizar = () => {
    const t = $('#m_tipo').value, g = $('#m_grau').value;
    $('#exTipo').textContent = t ? T.tipos[t].d : 'Escolha o tipo de cadastro para ver as opções.';
    ['administrador', 'medium', 'consulente'].forEach(k => { $('#sec_' + k).hidden = k !== t; });
    $('#exGrau').textContent = g ? T.graus[g].d : 'Escolha o grau para ver a explicação.';
  };
  $('#m_tipo').onchange = atualizar; $('#m_grau').onchange = atualizar; atualizar();
  d.showModal();
  $('#m_nome').focus();
  $('#cancelar').onclick = () => d.close();
  const erro = t => { $('#erroF').textContent = t; };

    ev.preventDefault();
    const nome = $('#m_nome').value.trim(), tipo = $('#m_tipo').value;
    if (!nome) { erro('Preencha o nome.'); $('#m_nome').focus(); return; }
    if (!tipo) { erro('Escolha o tipo de cadastro.'); $('#m_tipo').focus(); return; }
    const marc = n => [...d.querySelectorAll(`input[name="${n}"]:checked`)].map(i => i.value);
    let funcoes = [], grau = null, acesso = false;
    if (tipo === 'administrador') funcoes = marc('f_adm');

    if (tipo === 'consulente') { funcoes = marc('f_con'); if (!funcoes.length) { erro('Escolha a função: contribuinte ou não contribuinte.'); return; } }
    const v = id => $(id).value.trim() || null;
    const obj = {nome, tipo, funcoes, grau, acesso_admin: acesso, telefone: v('#m_tel'), nascimento: v('#m_nasc'), data_entrada: v('#m_entr'), observacoes: v('#m_obs'), usuario_id: $('#m_conta').value || null};
    const btn = $('#salvar'); btn.disabled = true; erro('');
    const res = novo ? await sb.from('membros').insert(obj).select() : await sb.from('membros').update(obj).eq('id', row.id).select();
    if (res.error || !res.data || !res.data.length) { erro(res.error ? msgErro(res.error) : 'Não foi possível salvar.'); btn.disabled = false; return; }
    d.close(); aviso('Salvo.'); aoSalvar();
  };
}

async function rotear() {
  const h = (location.hash || '#/').replace(/^#\/?/, '');
  nav.classList.remove('aberto'); $('#menuBtn').setAttribute('aria-expanded', 'false');
  const adm = h.startsWith('admin');
  document.querySelectorAll('#nav a').forEach(a => {
    const ah = a.getAttribute('href').replace(/^#\/?/, '');
    a.toggleAttribute('aria-current', ah === h || (adm && ah.startsWith('admin')));
  });
  const mNot = h.match(/^noticia\/(\d+)$/);
  const f = mNot ? () => viewNoticia(Number(mNot[1])) : ROTAS[h];
  document.title = CONFIG.nome;
  if (!f) { location.hash = '#/'; return; }
  if (h === 'entrar' && sessao) { location.hash = '#/'; return; }
  if (adm && !exigirAdmin()) return;
  if (perfil && perfil.papel === 'admin') limparEventosEncerrados();
  await f();
  window.scrollTo(0, 0);
}

async function iniciar() {
  document.title = CONFIG.nome;
  $('#marcaTxt').textContent = CONFIG.nome;
  const ic = document.createElement('link'); ic.rel = 'icon'; ic.href = $('#logoTopo').src; document.head.appendChild(ic);
  $('#menuBtn').onclick = () => { const a = nav.classList.toggle('aberto'); $('#menuBtn').setAttribute('aria-expanded', String(a)); };
  window.addEventListener('hashchange', rotear);
  app.addEventListener('click', ev => {
    const b = ev.target.closest('button[data-acao]'); if (!b) return;
    if (b.dataset.acao === 'curtir') alternarCurtida(b);
    else if (b.dataset.acao === 'compartilhar') compartilhar(Number(b.dataset.id), b.dataset.titulo);
    else if (b.dataset.acao === 'irei') salvarPresenca(Number(b.dataset.id), true, null, b.closest('.presenca'));
    else if (b.dataset.acao === 'naoirei') { const w = b.closest('.presenca'); w.querySelector('.pr-motivo').hidden = false; w.querySelector('input').focus(); }
    else if (b.dataset.acao === 'salvar-motivo') {
      const w = b.closest('.presenca'), m = w.querySelector('input').value.trim();
      if (!m) { aviso('Informe o motivo de não ir.', true); return; }
      salvarPresenca(Number(b.dataset.id), false, m, w);
    }
  });
  try {
    const {data} = await sb.auth.getSession();
    sessao = data.session;
    await carregarPerfil();
  } catch (e) { sessao = null; perfil = null; }
  desenharNav();
  await rotear();
  window.__ok = true;
  sb.auth.onAuthStateChange((ev, s) => {
    if (ev === 'INITIAL_SESSION' || ev === 'TOKEN_REFRESHED') { if (s) sessao = s; return; }
    const mesmo = (s && s.user && sessao && sessao.user && s.user.id === sessao.user.id);
    sessao = s;
    if (mesmo) return;
    setTimeout(async () => { await carregarPerfil(); desenharNav(); rotear(); }, 0);
  });
}
iniciar();
</script>
